<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>adidas | Login</title>
  <link rel="stylesheet" href="css/adidas.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  
  <div class="bg">
    <div class="bg-stripes"></div>
    <div class="bg-grid"></div>
    <canvas id="particles"></canvas>
  </div>

  <div class="wrapper">
    
    <div class="brand-side">
      <div class="brand-content">
        <div class="big-logo">
          <div class="logo-stripes">
            <span></span><span></span><span></span>
          </div>
          <h1>adidas</h1>
        </div>
        
        <div class="brand-text">
          <h2>Impossible<br>is Nothing</h2>
          <p>Entre na sua conta ou crie uma nova e faça parte do movimento.</p>
        </div>

        <div class="brand-footer">
          <span>© 2026 adidas</span>
        </div>
      </div>

      <!-- Decorative big stripes -->
      <div class="side-stripes">
        <div class="stripe"></div>
        <div class="stripe"></div>
        <div class="stripe"></div>
      </div>
    </div>

    <!-- RIGHT SIDE - Form -->
    <div class="form-side">
      <div class="form-card">
        <!-- Tabs -->
        <div class="tabs">
          <button class="tab active" data-tab="login">Entrar</button>
          <button class="tab" data-tab="register">Cadastrar</button>
          <div class="tab-glider"></div>
        </div>

        <!-- LOGIN -->
        <form id="loginForm" class="form active">
          <div class="input-group">
            <input type="email" id="loginEmail" required autocomplete="email" placeholder=" " />
            <label>E-mail</label>
            <div class="input-line"></div>
          </div>

          <div class="input-group">
            <input type="password" id="loginPassword" required autocomplete="current-password" placeholder=" " />
            <label>Senha</label>
            <div class="input-line"></div>
            <button type="button" class="eye" data-target="loginPassword">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>

          <div class="row">
            <label class="check">
              <input type="checkbox" id="remember">
              <span class="box"></span>
              Lembrar de mim
            </label>
            <a href="#" class="link">Esqueceu a senha?</a>
          </div>

          <button type="submit" class="btn">
            <span class="btn-text">Entrar</span>
            <span class="btn-loader"></span>
            <div class="btn-stripes"><i></i><i></i><i></i></div>
          </button>
        </form>

        <!-- REGISTER -->
        <form id="registerForm" class="form">
          <div class="input-group">
            <input type="text" id="regName" required autocomplete="name" placeholder=" " />
            <label>Nome completo</label>
            <div class="input-line"></div>
          </div>

          <div class="input-group">
            <input type="email" id="regEmail" required autocomplete="email" placeholder=" " />
            <label>E-mail</label>
            <div class="input-line"></div>
          </div>

          <div class="input-group">
            <input type="password" id="regPassword" required autocomplete="new-password" placeholder=" " />
            <label>Senha</label>
            <div class="input-line"></div>
            <button type="button" class="eye" data-target="regPassword">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>

          <!-- Strength meter -->
          <div class="strength">
            <div class="strength-bar"><span></span></div>
            <small class="strength-text">Força da senha</small>
          </div>

          <div class="input-group">
            <input type="password" id="regConfirm" required autocomplete="new-password" placeholder=" " />
            <label>Confirmar senha</label>
            <div class="input-line"></div>
            <button type="button" class="eye" data-target="regConfirm">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>

          <div class="row">
            <label class="check">
              <input type="checkbox" id="terms" required>
              <span class="box"></span>
              Aceito os <a href="#" class="link">Termos</a>
            </label>
          </div>

          <button type="submit" class="btn">
            <span class="btn-text">Criar conta</span>
            <span class="btn-loader"></span>
            <div class="btn-stripes"><i></i><i></i><i></i></div>
          </button>
        </form>

        <div class="divider">
          <span>ou continue com</span>
        </div>

        <div class="socials">
          <button class="social" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          </button>
          <button class="social" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .76-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="js/script.js"></script>
</body>
</html>
