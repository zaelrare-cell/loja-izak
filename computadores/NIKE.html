<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Nike</title>
    <link rel="stylesheet" href="css/NIKE.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>NIKE</h1>

        <nav>
            <a href="#">Início</a>
            <a href="#">Tênis</a>
            <a href="#">Roupas</a>
            <a href="#">Ofertas</a>
        </nav>
    </header>

    <section class="banner">
        <h2>JUST DO IT.</h2>
        <p>Encontre os melhores produtos Nike.</p>
        <button>Comprar agora</button>
    </section>

    <section class="produtos">

        <h2>Produtos em destaque</h2>

        <div class="cards">

            <div class="card">
                <img 
         n      class="foto" src="air max.jpg" nike air max>
                <h3>Nike Air Max</h3>
                <p>Tênis esportivo</p>
                <strong>R$ 599,90</strong>
                <button>Comprar</button>
            </div>

            <div class="card">
                <img 
                class="foto" src="air force.jpg" nike air force>
                <h3>Nike Air Force 1</h3>
                <p>Tênis casual</p>
                <strong>R$ 699,90</strong>
                <button>Comprar</button>
            </div>

            <div class="card">
                <img 
                class="foto" src="camisa nike.avif" camisa nike>
                <h3>Camiseta Nike</h3>
                <p>Camiseta esportiva</p>
                <strong>R$ 149,90</strong>
                <button>Comprar</button>
            </div>

        </div>

    </section>

    <footer>
        <p>© 2026 Nike Store - Projeto escolar</p>
    </footer>

</body>
</html>
