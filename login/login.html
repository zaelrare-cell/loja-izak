<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tela de Login</title>

    <link rel="stylesheet" href="css/login.css">

    <script src="java/java.js" defer></script>
</head>
<body>

    <div class="container">
        <div class="login-box">

            <h1>Bem-vindo!</h1>
            <p class="subtitulo">
                Entre na sua conta para continuar.
            </p>

            <form id="formulario">

                <div class="campo">
                    <label for="usuario">Usuário</label>
                    <input
                        type="text"
                        id="usuario"
                        placeholder="Digite seu usuário"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <a href="#" class="esqueci-senha">
                    Esqueceu sua senha?
                </a>

                <button type="submit" id="botaoEntrar">
                    Entrar
                </button>

                <p id="mensagem"></p>

            </form>

            <p class="cadastro">
                Não tem uma conta?
                <a href="#">Cadastre-se</a>
            </p>

        </div>
    </div>

</body>
</html>
